{% if messages %}
<div class="fixed top-4 right-4 z-[60] flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4">
    {% for message in messages %}
    <div class="pointer-events-auto rounded-2xl border px-4 py-3 text-sm font-semibold shadow-lg
        {% if message.tags == 'error' %}bg-rose-50 border-rose-200 text-rose-800
        {% elif message.tags == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-800
        {% else %}bg-indigo-50 border-indigo-200 text-indigo-800{% endif %}">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
