<!-- Toolbar de Acessibilidade -->
<div id="accessibility-toolbar-container"></div>
<div vw class="vlibras-container" aria-label="Tradutor de Libras">
    <div vw-access-button></div>
    <div vw-plugin-wrapper></div>
</div>
<script id="vlibras-plugin" src="https://vlibras.gov.br/app/vlibras-plugin.js" async defer></script>
<script>
(function() {
    const initVlibrasWidget = function() {
        if (window.__petPaparicoVlibrasInitialized) return;
        if (!window.VLibras || typeof window.VLibras.Widget !== 'function') return;
        window.__petPaparicoVlibrasInitialized = true;
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    };

    const pluginScript = document.getElementById('vlibras-plugin');
    if (pluginScript) {
        pluginScript.addEventListener('load', initVlibrasWidget, { once: true });
    }

    if (document.readyState === 'complete') {
        initVlibrasWidget();
    } else {
        window.addEventListener('load', initVlibrasWidget, { once: true });
    }
})();
</script>

<style>
/* Toolbar de Acessibilidade */
#accessibility-toolbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 999999;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    background: transparent;
    border-bottom: none;
    box-shadow: none;
    transition: all 0.3s ease;
    pointer-events: none;
}

#accessibility-toolbar.hidden {
    transform: translateY(-100%);
}

.a11y-btn {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 6px 12px;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s ease;
    color: #1e293b;
    font-weight: 600;
    font-size: 12px;
    white-space: nowrap;
    pointer-events: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.a11y-btn:hover {
    background: #e0e7ff;
    border-color: #6366f1;
    color: #4f46e5;
    transform: scale(1.05);
}

.a11y-btn:focus {
    outline: 3px solid #6366f1;
    outline-offset: 2px;
}

.a11y-btn:active {
    transform: scale(0.95);
}

.a11y-btn-label {
    font-size: 11px;
    line-height: 1;
}

.a11y-toggle-btn {
    margin-left: 8px;
    border-left: 2px solid #e2e8f0;
    padding-left: 12px;
}

/* Ajustar body para compensar toolbar fixa */
body {
    padding-top: 60px;
}

/* Responsividade */
@media (max-width: 768px) {
    #accessibility-toolbar {
        gap: 4px;
        padding: 6px 8px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .a11y-btn {
        padding: 4px 8px;
        font-size: 11px;
    }

    .a11y-btn-label {
        display: none;
    }

    body {
        padding-top: 70px;
    }
}

/* Alto Contraste */
body.high-contrast {
    background: #000000 !important;
    color: #ffffff !important;
}

body.high-contrast * {
    background-color: #000000 !important;
    color: #ffffff !important;
    border-color: #ffffff !important;
}

body.high-contrast a,
body.high-contrast button {
    color: #ffff00 !important;
}

body.high-contrast a:hover,
body.high-contrast button:hover {
    color: #00ffff !important;
    text-decoration: underline !important;
}

body.high-contrast input,
body.high-contrast select,
body.high-contrast textarea {
    background: #000000 !important;
    color: #ffffff !important;
    border: 2px solid #ffffff !important;
}

body.high-contrast img {
    filter: grayscale(100%) contrast(150%);
}

body.high-contrast .bg-white,
body.high-contrast .bg-slate-50,
body.high-contrast .bg-slate-100,
body.high-contrast .bg-slate-50\/50 {
    background-color: #000000 !important;
}

body.high-contrast .text-slate-500,
body.high-contrast .text-slate-400,
body.high-contrast .text-slate-600 {
    color: #ffffff !important;
}

body.high-contrast .border,
body.high-contrast .border-slate-100,
body.high-contrast .border-slate-200 {
    border-color: #ffffff !important;
}

/* Anunciador para leitores de tela */
#a11y-announcer {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border-width: 0;
}
</style>

<script>
(function() {
    'use strict';

    const AccessibilityManager = {
        defaults: {
            fontSize: 100,
            highContrast: false,
            vlibras: true
        },

        limits: {
            minFontSize: 80,
            maxFontSize: 150,
            fontSizeStep: 10
        },

        init() {
            this.loadPreferences();
            this.applyPreferences();
            this.createToolbar();
            this.initVLibras();
            this.bindKeyboardShortcuts();
        },

        loadPreferences() {
            try {
                const saved = localStorage.getItem('petPaparicoAccessibility');
                if (saved) {
                    this.preferences = { ...this.defaults, ...JSON.parse(saved) };
                } else {
                    this.preferences = { ...this.defaults };
                }
            } catch (e) {
                this.preferences = { ...this.defaults };
            }
        },

        savePreferences() {
            try {
                localStorage.setItem('petPaparicoAccessibility', JSON.stringify(this.preferences));
            } catch (e) {
                console.warn('Não foi possível salvar preferências:', e);
            }
        },

        applyPreferences() {
            this.applyFontSize();
            this.applyHighContrast();
        },

        applyFontSize() {
            document.documentElement.style.fontSize = this.preferences.fontSize + '%';
        },

        applyHighContrast() {
            if (this.preferences.highContrast) {
                document.body.classList.add('high-contrast');
            } else {
                document.body.classList.remove('high-contrast');
            }
        },

        increaseFontSize() {
            if (this.preferences.fontSize < this.limits.maxFontSize) {
                this.preferences.fontSize += this.limits.fontSizeStep;
                this.applyFontSize();
                this.savePreferences();
                this.updateToolbarUI();
                this.announce('Tamanho da fonte aumentado para ' + this.preferences.fontSize + '%');
            }
        },

        decreaseFontSize() {
            if (this.preferences.fontSize > this.limits.minFontSize) {
                this.preferences.fontSize -= this.limits.fontSizeStep;
                this.applyFontSize();
                this.savePreferences();
                this.updateToolbarUI();
                this.announce('Tamanho da fonte diminuído para ' + this.preferences.fontSize + '%');
            }
        },

        resetFontSize() {
            this.preferences.fontSize = this.defaults.fontSize;
            this.applyFontSize();
            this.savePreferences();
            this.updateToolbarUI();
            this.announce('Tamanho da fonte restaurado ao padrão');
        },

        toggleHighContrast() {
            this.preferences.highContrast = !this.preferences.highContrast;
            this.applyHighContrast();
            this.savePreferences();
            this.updateToolbarUI();
            const status = this.preferences.highContrast ? 'ativado' : 'desativado';
            this.announce('Alto contraste ' + status);
        },

        createToolbar() {
            const container = document.getElementById('accessibility-toolbar-container');
            if (!container) return;

            const toolbar = document.createElement('div');
            toolbar.id = 'accessibility-toolbar';
            toolbar.setAttribute('role', 'toolbar');
            toolbar.setAttribute('aria-label', 'Ferramentas de acessibilidade');
            
            toolbar.innerHTML = [
                '<button type="button" id="a11y-decrease-font" class="a11y-btn" aria-label="Diminuir tamanho da fonte" title="Diminuir fonte (Ctrl + -)">',
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
                '<span class="a11y-btn-label">A-</span>',
                '</button>',
                
                '<button type="button" id="a11y-increase-font" class="a11y-btn" aria-label="Aumentar tamanho da fonte" title="Aumentar fonte (Ctrl + +)">',
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
                '<span class="a11y-btn-label">A+</span>',
                '</button>',
                
                '<button type="button" id="a11y-reset-font" class="a11y-btn" aria-label="Restaurar tamanho padrão da fonte" title="Restaurar fonte padrão (Ctrl + 0)">',
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>',
                '<span class="a11y-btn-label">Reset</span>',
                '</button>',
                
                '<button type="button" id="a11y-contrast" class="a11y-btn" aria-label="Alternar alto contraste" title="Alto contraste (Ctrl + C)">',
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"></path></svg>',
                '<span class="a11y-btn-label">Contraste</span>',
                '</button>',
                
                '<button type="button" id="a11y-toggle" class="a11y-btn a11y-toggle-btn" aria-label="Fechar toolbar de acessibilidade" title="Fechar toolbar">',
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>',
                '</button>'
            ].join('');

            container.appendChild(toolbar);
            this.bindToolbarEvents();
            this.updateToolbarUI();
        },

        bindToolbarEvents() {
            const self = this;
            
            document.getElementById('a11y-decrease-font')?.addEventListener('click', function() {
                self.decreaseFontSize();
            });
            
            document.getElementById('a11y-increase-font')?.addEventListener('click', function() {
                self.increaseFontSize();
            });
            
            document.getElementById('a11y-reset-font')?.addEventListener('click', function() {
                self.resetFontSize();
            });
            
            document.getElementById('a11y-contrast')?.addEventListener('click', function() {
                self.toggleHighContrast();
            });
            
            document.getElementById('a11y-toggle')?.addEventListener('click', function() {
                const toolbar = document.getElementById('accessibility-toolbar');
                if (toolbar) {
                    toolbar.classList.toggle('hidden');
                }
            });
        },

        updateToolbarUI() {
            const contrastBtn = document.getElementById('a11y-contrast');
            if (contrastBtn) {
                if (this.preferences.highContrast) {
                    contrastBtn.style.background = '#ffff00';
                    contrastBtn.style.color = '#000000';
                    contrastBtn.style.borderColor = '#ffff00';
                } else {
                    contrastBtn.style.background = '';
                    contrastBtn.style.color = '';
                    contrastBtn.style.borderColor = '';
                }
            }
        },

        initVLibras() {
            if (!this.preferences.vlibras) return;
        },

        bindKeyboardShortcuts() {
            const self = this;
            
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && (e.key === '+' || e.key === '=')) {
                    e.preventDefault();
                    self.increaseFontSize();
                }
                
                if (e.ctrlKey && e.key === '-') {
                    e.preventDefault();
                    self.decreaseFontSize();
                }
                
                if (e.ctrlKey && e.key === '0') {
                    e.preventDefault();
                    self.resetFontSize();
                }
                
                if (e.ctrlKey && e.key === 'c' && !window.getSelection().toString()) {
                    e.preventDefault();
                    self.toggleHighContrast();
                }
            });
        },

        announce(message) {
            let announcer = document.getElementById('a11y-announcer');
            if (!announcer) {
                announcer = document.createElement('div');
                announcer.id = 'a11y-announcer';
                announcer.setAttribute('aria-live', 'polite');
                announcer.setAttribute('aria-atomic', 'true');
                document.body.appendChild(announcer);
            }
            announcer.textContent = message;
            setTimeout(function() {
                announcer.textContent = '';
            }, 1000);
        }
    };

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            AccessibilityManager.init();
        });
    } else {
        AccessibilityManager.init();
    }

    window.AccessibilityManager = AccessibilityManager;
})();
</script>
