<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .intact {
      animation: show-intact 2.8s ease-in-out infinite;
    }

    .bitten {
      animation: show-bitten 2.8s ease-in-out infinite;
    }

    .crumb {
      transform-box: fill-box;
      transform-origin: center;
      animation: crumb 2.8s ease-in-out infinite;
    }

    .crumb:nth-of-type(2) { animation-delay: .12s; }
    .crumb:nth-of-type(3) { animation-delay: .24s; }

    @keyframes crumb {
      0%, 32%, 90%, 100% { opacity: 0; transform: translateY(1px) scale(.8); }
      48%, 72% { opacity: 1; transform: translateY(-2px) scale(1); }
    }

    @keyframes show-intact {
      0%, 35%, 88%, 100% { opacity: 1; }
      44%, 80% { opacity: 0; }
    }

    @keyframes show-bitten {
      0%, 35%, 88%, 100% { opacity: 0; }
      44%, 80% { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intact, .crumb { animation: none; opacity: 0; }
      .bitten { animation: none; opacity: 1; }
    }
  </style>
  <g class="intact">
    <circle cx="32" cy="32" r="29" fill="#D9903D" stroke="#A85E27" stroke-width="2.5"/>
    <path d="M20.5 13.5c2.4-2 5.2-3.2 8.2-3.6" stroke="#F6C77D" stroke-width="2" stroke-linecap="round"/>
    <circle cx="19" cy="25" r="3" fill="#633A2A"/>
    <circle cx="34" cy="15" r="2.7" fill="#633A2A"/>
    <circle cx="43" cy="29" r="3.1" fill="#633A2A"/>
    <circle cx="24" cy="43" r="2.5" fill="#633A2A"/>
    <circle cx="39" cy="45" r="2.2" fill="#633A2A"/>
    <circle cx="31" cy="31" r="2.6" fill="#633A2A"/>
  </g>
  <g class="bitten">
    <path d="M47 11.8c-5.1-.7-8.4 2.2-8.5 6.7-4.8-1.1-8.3 2-7.5 6.4-4.6 1.1-6.4 5.5-3.7 9.1-3.1 3.9-1.7 8.3 2.7 9.9C29.5 53.5 21.4 61 12.4 54.2-1.2 43.9 1.8 22.1 13 10.1 22.8-.3 39.1-.1 47 11.8Z" fill="#D9903D" stroke="#A85E27" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M14.5 18.5c2.4-2 5.2-3.2 8.2-3.6" stroke="#F6C77D" stroke-width="2" stroke-linecap="round"/>
    <circle cx="18" cy="29" r="3" fill="#633A2A"/>
    <circle cx="34" cy="15" r="2.7" fill="#633A2A"/>
    <circle cx="20" cy="44" r="2.5" fill="#633A2A"/>
    <circle cx="34" cy="32" r="2.2" fill="#633A2A"/>
  </g>
  <circle class="crumb" cx="54" cy="17" r="2" fill="#D9903D"/>
  <circle class="crumb" cx="59" cy="24" r="1.4" fill="#A85E27"/>
  <circle class="crumb" cx="53" cy="10" r="1.3" fill="#D9903D"/>
</svg>
